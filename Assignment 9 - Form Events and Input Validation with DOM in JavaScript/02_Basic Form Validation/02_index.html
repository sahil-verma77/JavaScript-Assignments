<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"

<body class="flex flex-col items-start gap-10 font-serif text-lg font-medium m-5">

    <form action="" id="form">
        <label for="name">Name: </label>
        <input id="input" type="text" class="border border-black px-2" placeholder="Enter your name:"
            style="width: 250px">
        <button type="submit">Submit</button>
        <p id="display-text"></p>
    </form>
    <!-- Script 7: -->
    <script src="07_Validate_A_Required_Name_Field.js"></script>


    <form action="" id="form-2">
        <label for="email">Email: </label>
        <input id="input-2" type="email" class="border border-black px-2" placeholder="Enter your email:"
            style="width: 250px">
        <button type="submit">Submit</button>
        <p id="display-text-2"></p>
    </form>
    <!-- Script 8: -->
    <script src="08_Validate_Email_Field.js"></script>


    <form action="" id="form-3">
        <label for="password">Password: </label>
        <input id="input-3" type="password" class="border border-black px-2" placeholder="Enter your password:"
            style="width: 250px">
        <button type="submit">Submit</button>
        <p id="display-text-3"></p>
    </form>
    <!-- Script 9: -->
    <script src="09_Validate_Password_Length.js"></script>


    <form action="" id="form-4" class="flex flex-col gap-5 border border-black p-10">
        <div>
            <label for="name">Name: </label>
            <input id="name" type="text" class="border border-black px-2" placeholder="Enter your name:"
                style="width: 250px">
        </div>

        <div>
            <label for="email">Email: </label>
            <input id="email" type="email" class="border border-black px-2" placeholder="Enter your email:"
                style="width: 250px">
        </div>

        <div>
            <label for="password">Password: </label>
            <input id="password" type="password" class="border border-black px-2" placeholder="Enter your password:"
                style="width: 250px">
        </div>
        <button type="submit">Submit</button>

        <p id="display-text-4"></p>
    </form>
    <!-- Script 10: -->
    <script src="10_Validate_Multiple_Form_Fields.js"></script>
</body>

</html>
